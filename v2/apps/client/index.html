<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giant Appetite - Cut &amp; Burn toy</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a1f; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
      .hud { position: fixed; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 6px; max-width: 340px; pointer-events: none; }
      .hud-row, .hud-card, .hud-help, .hud-toast { background: rgba(20, 16, 14, 0.72); color: #f6efe4; border-radius: 8px; padding: 6px 10px; font-size: 13px; line-height: 1.35; backdrop-filter: blur(3px); }
      .hud-row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
      .hud-label { color: #b9a995; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
      .hud-card { opacity: 0; transition: opacity 0.6s ease; }
      .hud-card-title { color: #b9a995; font-size: 12px; margin-bottom: 2px; }
      .hud-card-top { display: flex; align-items: baseline; gap: 10px; }
      .hud-score { font-size: 30px; font-weight: 800; }
      .hud-tier { font-size: 16px; font-weight: 700; }
      .hud-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
      .hud-chip { background: rgba(255, 255, 255, 0.14); border-radius: 999px; padding: 1px 8px; font-size: 11px; }
      .hud-toast { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
      .hud-help { position: fixed; top: 10px; right: 10px; opacity: 1; transition: opacity 0.5s ease; pointer-events: none; max-width: 260px; }
      .hud-help-title { font-weight: 700; margin-bottom: 4px; }
      .hud-help-row { display: flex; gap: 8px; align-items: baseline; font-size: 12px; }
      .hud-help-row kbd { background: rgba(255, 255, 255, 0.16); border-radius: 4px; padding: 0 5px; font: 11px/1.5 monospace; min-width: 64px; text-align: center; }
      .hud-debug { position: fixed; bottom: 6px; left: 8px; margin: 0; font: 12px/1.4 monospace; color: #fff; background: rgba(0, 0, 0, 0.5); padding: 4px 8px; border-radius: 4px; pointer-events: none; white-space: pre; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
